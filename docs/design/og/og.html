<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;1,400&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #ffffff;
    font-family: "IBM Plex Sans", sans-serif;
    color: #16181d;
    position: relative;
    overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(#d9dce2 1.2px, transparent 1.2px);
    background-size: 28px 28px;
    mask-image: linear-gradient(100deg, transparent 38%, #000 75%);
  }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #d4213d; }
  .left { position: absolute; left: 96px; top: 92px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand svg { width: 76px; height: 76px; }
  .brand span { font-size: 54px; font-weight: 700; letter-spacing: -1.5px; }
  h1 {
    margin-top: 52px;
    font-family: "Source Serif 4", serif; font-weight: 400;
    font-size: 58px; line-height: 1.12; letter-spacing: -0.8px;
  }
  h1 em { color: #d4213d; }
  .url {
    position: absolute; left: 96px; bottom: 72px;
    font-family: "IBM Plex Mono", monospace; font-weight: 500;
    font-size: 24px; color: #6b7180;
  }
  .stack { position: absolute; right: 72px; top: 96px; width: 410px; }
  .card {
    background: #fff; border: 1.5px solid #dfe2e7; border-radius: 16px;
    padding: 24px 26px; box-shadow: 0 18px 40px -18px rgba(22,24,29,.22);
  }
  .card + .card { margin-top: 18px; }
  .card.back { transform: translateX(28px); opacity: .9; }
  .claim { font-size: 21px; font-weight: 500; line-height: 1.35; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
    padding: 7px 14px; border-radius: 999px; font-size: 17px; font-weight: 600;
  }
  .badge i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .false { color: #8a1538; background: #fbe9ee; }
  .true { color: #0b6e4f; background: #e7f4ee; }
  .insufficient { color: #475467; background: #eef0f3; }
  .src {
    margin-top: 14px; font-family: "IBM Plex Mono", monospace; font-size: 15px; color: #6b7180;
    border-left: 3px solid #d4213d; padding-left: 10px;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="bar"></div>
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 48 48">
        <path d="M24 11C21.2 8.2 21.2 4.4 24 1.2C26.8 4.4 26.8 8.2 24 11Z" fill="#d4213d"/>
        <path d="M24 37C26.8 39.8 26.8 43.6 24 46.8C21.2 43.6 21.2 39.8 24 37Z" fill="#16181d"/>
        <path d="M4 24C10.5 9.5 37.5 9.5 44 24C37.5 38.5 10.5 38.5 4 24Z" fill="#16181d"/>
        <circle cx="24" cy="24" r="7.6" fill="#ffffff"/>
        <circle cx="24" cy="24" r="3.8" fill="#d4213d"/>
      </svg>
      <span>Prawdowid</span>
    </div>
    <h1>Sprawdź informację<br>w&nbsp;<em>jawnych, oficjalnych</em><br>źródłach.</h1>
  </div>
  <div class="url">prawdowid.michalges.com</div>

  <div class="stack">
    <div class="card">
      <p class="claim">„Inflacja w Polsce w 2025 r. przekroczyła 15%.”</p>
      <span class="badge false"><i></i>Fałszywe</span>
      <p class="src">GUS · wskaźniki cen, 2025</p>
    </div>
    <div class="card back">
      <p class="claim">„Polska jest członkiem NATO od 1999 roku.”</p>
      <span class="badge true"><i></i>Potwierdzone</span>
    </div>
  </div>
</body>
</html>
