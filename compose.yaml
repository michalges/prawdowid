services:
  api:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    init: true
    restart: unless-stopped
    environment:
      CORPUS_AUTO_BUILD: ${CORPUS_AUTO_BUILD:-true}
      CORPUS_ALLOW_UNVERIFIED: ${CORPUS_ALLOW_UNVERIFIED:-false}
      CORPUS_MAX_DOCS_PER_SOURCE: ${CORPUS_MAX_DOCS_PER_SOURCE:-15}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-25}
      LLM_PRICE_INPUT_PER_MTOK_USD: ${LLM_PRICE_INPUT_PER_MTOK_USD:-}
      LLM_PRICE_OUTPUT_PER_MTOK_USD: ${LLM_PRICE_OUTPUT_PER_MTOK_USD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_EU_ROUTING: ${OPENROUTER_EU_ROUTING:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
      EUVSDISINFO_TOKEN: ${EUVSDISINFO_TOKEN:-}
      MODERATOR_DISCORD_WEBHOOK_URL: ${MODERATOR_DISCORD_WEBHOOK_URL:-}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-http://localhost:8080}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_PURGE_INTERVAL_MINUTES: ${RETENTION_PURGE_INTERVAL_MINUTES:-60}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-200}
    volumes:
      - state:/app/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; h = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); raise SystemExit(h['corpus_chunks'] <= 0)"
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 3

  web:
    build:
      context: ./web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29-alpine}
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  discord:
    build:
      context: ./channels/discord_bot
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      PRAWDOWID_API_URL: http://api:8000
      WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-http://localhost:8080}
      API_TIMEOUT_S: ${DISCORD_API_TIMEOUT_S:-180}

volumes:
  state:
