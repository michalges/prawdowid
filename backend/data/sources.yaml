# Prawdowid source catalog (open, auditable). Rules: docs/SOURCES.md. Schema: docs/CONCEPT.md §6.3.
# Seeded from the organizer's example list (MSZ challenge Discord, 2026-11-21).
# Check terms and robots.txt before first ingest. Set license_verified only after checking the reuse terms.
#
# fetch_mode:
#   listing    crawl a news/warnings index page, ingest each linked article (published_at from the article)
#   page       ingest one static reference page
#   live_link  dynamic map/dashboard/app; NOT ingested and never cited. Only shown as "check live data here"
#   api        queried at check time through a provider with a mock (see docs/SOURCES.md §4)
# use:
#   evidence      can support or refute a claim
#   context_only  shown as a context notice, never decides a verdict (CONCEPT §7.3)
#   pointer       link for the user only

